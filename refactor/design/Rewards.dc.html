<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>奖励反馈</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>

</style>
</helmet>
<div style="width: 1280px; height: 760px; box-sizing: border-box; padding: 32px 40px; background-color: #F5F7FB; background-image: radial-gradient(#D5DCE8 1px, transparent 1px); background-size: 22px 22px; color: #0F172A; font-family: 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px;">
<div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #0F766E;">FEEDBACK</span>
<h1 style="margin: 2px 0 0; font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.01em;">奖励反馈：鼓励，但不打扰</h1>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; flex: 1;">

<section style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; border: 1px solid #E2E8F0; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(15,23,42,0.05), 0 12px 32px rgba(15,23,42,0.06);">
<span style="align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #B45309;">STAR EARNED</span>
<svg viewBox="0 0 120 120" width="170" height="170" aria-hidden="true">
<defs>
<linearGradient id="star" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"></stop><stop offset="1" stop-color="#F59E0B"></stop></linearGradient>
</defs>
<circle cx="60" cy="62" r="50" fill="#F59E0B" opacity="0.10"></circle>
<path d="M60 6v10M60 108v8M8 62h10M104 62h8M24 26l7 7M89 91l7 7M96 26l-7 7M31 91l-7 7" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.6"></path>
<path d="M60 24 L70.5 47.5 L96 50 L76.5 67 L82.5 92.5 L60 79 L37.5 92.5 L43.5 67 L24 50 L49.5 47.5 Z" fill="url(#star)" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"></path>
<path d="M52 44 L58 34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"></path>
</svg>
<div style="display: flex; gap: 6px; font-size: 26px; color: #F59E0B;" aria-label="本关已获得两颗星"><span>★</span><span>★</span><span style="color: #CBD5E1;">★</span></div>
<span style="padding: 8px 14px; border-radius: 10px; background: #0F172A; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;">+50 XP · STAR 2/3</span>
<p style="margin: 0; font-size: 13px; color: #64748B; text-align: center;">星星依次点亮，每颗约 0.15 秒，轻微放大后回落</p>
</section>

<section style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; border: 1px solid #1E293B; border-radius: 22px; background: #0B1220; color: #E2E8F0; box-shadow: 0 20px 48px rgba(15,23,42,0.2);">
<span style="align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #5EEAD4;">LEVEL UP</span>
<svg viewBox="0 0 140 140" width="160" height="160" aria-hidden="true">
<circle cx="70" cy="70" r="64" fill="none" stroke="#1E293B" stroke-width="8"></circle>
<circle cx="70" cy="70" r="64" fill="none" stroke="#2DD4BF" stroke-width="8" stroke-linecap="round" stroke-dasharray="402 402" transform="rotate(-90 70 70)"></circle>
<path d="M70 26 L106 47 L106 93 L70 114 L34 93 L34 47 Z" fill="#111A2E" stroke="#2DD4BF" stroke-width="2"></path>
<path d="M44 54h-8M44 70h-8M44 86h-8M96 54h8M96 70h8M96 86h8" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" opacity="0.6"></path>
<text x="70" y="64" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#5EEAD4">LV</text>
<text x="70" y="94" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">4</text>
<circle cx="18" cy="24" r="3" fill="#F59E0B"></circle>
<rect x="116" y="18" width="6" height="10" rx="1.5" fill="#38BDF8" transform="rotate(25 119 23)"></rect>
<rect x="12" y="110" width="6" height="10" rx="1.5" fill="#A78BFA" transform="rotate(-20 15 115)"></rect>
<circle cx="124" cy="112" r="2.5" fill="#F472B6"></circle>
</svg>
<strong style="font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif; font-size: 30px; color: #FFFFFF;">升到 Lv.4</strong>
<p style="margin: 0; text-align: center; font-size: 14px; color: #94A3B8;">离铸造城的推荐等级还有 6 级<br>下一关：1-4 一起行动的小队</p>
<button type="button" style="min-height: 42px; padding: 0 20px; border: 0; border-radius: 10px; background: #2DD4BF; color: #0B1220; font: inherit; font-weight: 700; cursor: pointer;">继续冒险</button>
<p style="margin: 0; font-size: 12px; color: #64748B; text-align: center;">不超过 1.5 秒，点一下就跳过，不遮住整页</p>
</section>

<section style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; border: 1px solid #E2E8F0; border-radius: 22px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(15,23,42,0.05), 0 12px 32px rgba(15,23,42,0.06);">
<span style="align-self: flex-start; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #6D28D9;">NEW BADGE</span>
<svg viewBox="0 0 120 130" width="150" height="162" aria-hidden="true">
<defs>
<linearGradient id="medal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDE9FE"></stop><stop offset="1" stop-color="#C4B5FD"></stop></linearGradient>
</defs>
<path d="M42 96 L34 126 L48 118 L56 128 L62 102 Z M78 96 L86 126 L72 118 L64 128 L58 102 Z" fill="#8B5CF6" stroke="#0F172A" stroke-width="2.2" stroke-linejoin="round"></path>
<path d="M60 8 L100 31 L100 77 L60 100 L20 77 L20 31 Z" fill="url(#medal)" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"></path>
<path d="M60 18 L91 36 L91 72 L60 90 L29 72 L29 36 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"></path>
<circle cx="56" cy="51" r="15" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"></circle>
<path d="M67 62 L79 74" stroke="#0F172A" stroke-width="5" stroke-linecap="round"></path>
<path d="M49 51 L54 56 L63 45" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<strong style="font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif; font-size: 24px;">识破假加速</strong>
<p style="margin: 0; text-align: center; font-size: 14px; color: #475569;">在 1-8 里发现：那份报告没等 GPU 算完就停了表。</p>
<p style="margin: 0; font-size: 12px; color: #64748B; text-align: center;">每枚徽章都对应一项可以验证的能力，不发「签到」类徽章</p>
</section>
</div>

<p style="margin: 0; padding: 12px 16px; border: 1px solid #E2E8F0; border-radius: 12px; background: #FFFFFF; font-size: 14px; color: #334155;">规则：犯错不扣分，没有生命值，没有倒计时；默认不播放声音；系统开启「减弱动态效果」时只淡入；彩带可以在设置里关掉。</p>
</div>
