<svg xmlns="http://www.w3.org/2000/svg" width="800" height="484" viewBox="0 0 800 484" role="img" aria-labelledby="title desc">
<title id="title">相同的数据配对，分给不同的线程</title>
<desc id="desc">8 个输入为 3、1、7、0、4、1、6、2。第一轮的四次加法都是位置 0 与 1、2 与 3、4 与 5、6 与 7 相加。B 版分别由线程 0、2、4、6 执行；C 版由连续的线程 0、1、2、3 执行。加法与写回位置相同，仅执行线程不同。</desc>
<rect width="800" height="484" rx="12" fill="#fcfbf7"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#27323a">
<text x="32" y="44" font-size="29" font-weight="600">相同的数据配对，分给不同的线程</text>
<text x="32" y="84" font-size="25" font-weight="600">B · 邻接配对，隔位线程</text>
<text x="32" y="275" font-size="25" font-weight="600">C · 邻接配对，连续线程</text>

<rect x="32" y="102" width="176" height="126" rx="7" fill="#fff" stroke="#cbd1d3"/>
<text x="120" y="130" text-anchor="middle" font-size="22" fill="#59646b">位置 0 和 1</text>
<text x="120" y="169" text-anchor="middle" font-size="29" font-weight="600">3 + 1 = 4</text>
<rect x="33" y="185" width="174" height="42" rx="6" fill="#f8efe1"/>
<text x="120" y="214" text-anchor="middle" font-size="25" fill="#b58547">线程 0</text>
<rect x="218" y="102" width="176" height="126" rx="7" fill="#fff" stroke="#cbd1d3"/>
<text x="306" y="130" text-anchor="middle" font-size="22" fill="#59646b">位置 2 和 3</text>
<text x="306" y="169" text-anchor="middle" font-size="29" font-weight="600">7 + 0 = 7</text>
<rect x="219" y="185" width="174" height="42" rx="6" fill="#f8efe1"/>
<text x="306" y="214" text-anchor="middle" font-size="25" fill="#b58547">线程 2</text>
<rect x="404" y="102" width="176" height="126" rx="7" fill="#fff" stroke="#cbd1d3"/>
<text x="492" y="130" text-anchor="middle" font-size="22" fill="#59646b">位置 4 和 5</text>
<text x="492" y="169" text-anchor="middle" font-size="29" font-weight="600">4 + 1 = 5</text>
<rect x="405" y="185" width="174" height="42" rx="6" fill="#f8efe1"/>
<text x="492" y="214" text-anchor="middle" font-size="25" fill="#b58547">线程 4</text>
<rect x="590" y="102" width="176" height="126" rx="7" fill="#fff" stroke="#cbd1d3"/>
<text x="678" y="130" text-anchor="middle" font-size="22" fill="#59646b">位置 6 和 7</text>
<text x="678" y="169" text-anchor="middle" font-size="29" font-weight="600">6 + 2 = 8</text>
<rect x="591" y="185" width="174" height="42" rx="6" fill="#f8efe1"/>
<text x="678" y="214" text-anchor="middle" font-size="25" fill="#b58547">线程 6</text>
<rect x="32" y="293" width="176" height="126" rx="7" fill="#fff" stroke="#cbd1d3"/>
<text x="120" y="321" text-anchor="middle" font-size="22" fill="#59646b">位置 0 和 1</text>
<text x="120" y="360" text-anchor="middle" font-size="29" font-weight="600">3 + 1 = 4</text>
<rect x="33" y="376" width="174" height="42" rx="6" fill="#e5f1e8"/>
<text x="120" y="405" text-anchor="middle" font-size="25" fill="#629578">线程 0</text>
<rect x="218" y="293" width="176" height="126" rx="7" fill="#fff" stroke="#cbd1d3"/>
<text x="306" y="321" text-anchor="middle" font-size="22" fill="#59646b">位置 2 和 3</text>
<text x="306" y="360" text-anchor="middle" font-size="29" font-weight="600">7 + 0 = 7</text>
<rect x="219" y="376" width="174" height="42" rx="6" fill="#e5f1e8"/>
<text x="306" y="405" text-anchor="middle" font-size="25" fill="#629578">线程 1</text>
<rect x="404" y="293" width="176" height="126" rx="7" fill="#fff" stroke="#cbd1d3"/>
<text x="492" y="321" text-anchor="middle" font-size="22" fill="#59646b">位置 4 和 5</text>
<text x="492" y="360" text-anchor="middle" font-size="29" font-weight="600">4 + 1 = 5</text>
<rect x="405" y="376" width="174" height="42" rx="6" fill="#e5f1e8"/>
<text x="492" y="405" text-anchor="middle" font-size="25" fill="#629578">线程 2</text>
<rect x="590" y="293" width="176" height="126" rx="7" fill="#fff" stroke="#cbd1d3"/>
<text x="678" y="321" text-anchor="middle" font-size="22" fill="#59646b">位置 6 和 7</text>
<text x="678" y="360" text-anchor="middle" font-size="29" font-weight="600">6 + 2 = 8</text>
<rect x="591" y="376" width="174" height="42" rx="6" fill="#e5f1e8"/>
<text x="678" y="405" text-anchor="middle" font-size="25" fill="#629578">线程 3</text>
<text x="400" y="460" text-anchor="middle" font-size="24" fill="#59646b">每次加法仍写回前一个位置 · 结果不变</text>
</g></svg>