<svg xmlns="http://www.w3.org/2000/svg" width="700" height="690" viewBox="0 0 700 690" role="img" aria-labelledby="title desc">
  <title id="title">求四个数的总和：先得到两个局部和</title>
  <desc id="desc">完整手算任务是把输入数组中的 1、2、10、20 相加得到总和 33。线程甲负责 1 和 2，得到局部和 3；线程乙负责 10 和 20，得到局部和 30。甲、乙是同一 block 的不同 wavefront 中的代表线程。最后还要合并两个局部和。该图只说明计算分工和结果依赖，不展示共享存储或同步机制。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 9 5 0 9Z" fill="#2f6e9e"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 9 5 0 9Z" fill="#a35d27"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 9 5 0 9Z" fill="#377554"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 9 5 0 9Z" fill="#59646b"/></marker>
  </defs>
  <rect width="700" height="690" rx="12" fill="#fcfbf7"/>
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#27323a" text-anchor="middle">
    <text x="32" y="48" font-size="30" font-weight="600" text-anchor="start">任务：求四个数的总和</text>
    <text x="350" y="95" font-size="26" fill="#59646b">输入数组</text>
    <rect x="126" y="118" width="96" height="70" rx="8" fill="#eaf2f8" stroke="#8fb4cf" stroke-width="2"/>
    <text x="174" y="164" font-size="34" fill="#2f6e9e" font-weight="600">1</text>
    <rect x="240" y="118" width="96" height="70" rx="8" fill="#eaf2f8" stroke="#8fb4cf" stroke-width="2"/>
    <text x="288" y="164" font-size="34" fill="#2f6e9e" font-weight="600">2</text>
    <rect x="364" y="118" width="96" height="70" rx="8" fill="#fff0e1" stroke="#d9ad83" stroke-width="2"/>
    <text x="412" y="164" font-size="34" fill="#a35d27" font-weight="600">10</text>
    <rect x="478" y="118" width="96" height="70" rx="8" fill="#fff0e1" stroke="#d9ad83" stroke-width="2"/>
    <text x="526" y="164" font-size="34" fill="#a35d27" font-weight="600">20</text>
    <path d="M230 198V264" fill="none" stroke="#2f6e9e" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
    <path d="M470 198V264" fill="none" stroke="#a35d27" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
    <rect x="54" y="275" width="272" height="165" rx="10" fill="#eaf2f8" stroke="#8fb4cf" stroke-width="2"/>
    <text x="190" y="312" font-size="26">线程甲 · wave 0</text>
    <text x="190" y="365" font-size="32" fill="#2f6e9e" font-weight="600">1 + 2 = 3</text>
    <text x="190" y="413" font-size="26">局部和 3</text>
    <rect x="374" y="275" width="272" height="165" rx="10" fill="#fff0e1" stroke="#d9ad83" stroke-width="2"/>
    <text x="510" y="312" font-size="26">线程乙 · wave 1</text>
    <text x="510" y="365" font-size="32" fill="#a35d27" font-weight="600">10 + 20 = 30</text>
    <text x="510" y="413" font-size="26">局部和 30</text>
    <path d="M190 451V478H300V512" fill="none" stroke="#2f6e9e" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
    <path d="M510 451V478H400V512" fill="none" stroke="#a35d27" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
    <rect x="147" y="521" width="406" height="96" rx="10" fill="#eaf4ec" stroke="#aecbb7" stroke-width="2"/>
    <text x="350" y="558" font-size="26" fill="#377554">合并两个局部和</text>
    <text x="350" y="598" font-size="34" fill="#377554" font-weight="600">3 + 30 = 33</text>
    <text x="350" y="661" font-size="24" fill="#59646b">甲、乙来自同一 block 的不同 wavefront</text>
  </g>
</svg>
