<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">逐次计时与整批计时</title>
<desc id="desc">逐次计时为每次调用放置起止 event，得到多个样本。整批计时在多次调用外放置一对 event，包含调用之间的空隙，只能得到每次平均时间。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#64748b"/></marker></defs>
<rect width="960" height="540" rx="16" fill="#f8fafc"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172b41">
<text x="32" y="44" font-size="25" font-weight="700">同样运行多次，得到的统计量可以不同</text>
<text x="32" y="74" font-size="16" fill="#526477">示意图，不按实际耗时比例绘制。绿色竖线代表 GPU 执行到的 event。</text>
<rect x="24" y="98" width="912" height="181" rx="12" fill="white" stroke="#d9e3ec"/>
<text x="44" y="130" font-size="20" font-weight="700">A · 逐次计时：每次调用各有一对 event</text>
<path d="M56 195H900" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g fill="#dceafc" stroke="#789cca"><rect x="107" y="169" width="136" height="50" rx="6"/><rect x="377" y="169" width="136" height="50" rx="6"/><rect x="647" y="169" width="136" height="50" rx="6"/></g>
<g font-size="18" text-anchor="middle"><text x="175" y="201">调用 1</text><text x="445" y="201">调用 2</text><text x="715" y="201">调用 3</text></g>
<g stroke="#178570" stroke-width="3"><path d="M97 151V229M253 151V229M367 151V229M523 151V229M637 151V229M793 151V229"/></g>
<g font-size="16" text-anchor="middle" fill="#178570"><text x="175" y="250">t₁</text><text x="445" y="250">t₂</text><text x="715" y="250">t₃</text></g>
<text x="291" y="171" text-anchor="middle" fill="#526477" font-size="14">同步</text><text x="563" y="171" text-anchor="middle" fill="#526477" font-size="14">同步</text>
<rect x="24" y="295" width="912" height="181" rx="12" fill="white" stroke="#d9e3ec"/>
<text x="44" y="327" font-size="20" font-weight="700">B · 整批计时：多次调用共用一对 event</text>
<path d="M56 390H900" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g fill="#dceafc" stroke="#789cca"><rect x="107" y="365" width="136" height="50" rx="6"/><rect x="377" y="365" width="136" height="50" rx="6"/><rect x="647" y="365" width="136" height="50" rx="6"/></g>
<g font-size="18" text-anchor="middle"><text x="175" y="396">调用 1</text><text x="445" y="396">调用 2</text><text x="715" y="396">调用 3</text></g>
<g stroke="#178570" stroke-width="3"><path d="M97 347V425M793 347V425"/></g>
<path d="M97 434V443H793V434" fill="none" stroke="#178570" stroke-width="2"/>
<text x="445" y="466" font-size="17" fill="#178570" text-anchor="middle">总时间 T，示例每次平均时间为 T / 3</text>
<g font-size="14" text-anchor="middle" fill="#a5651b"><text x="310" y="369">空隙也被计入</text><text x="580" y="369">空隙也被计入</text></g>
<text x="32" y="513" font-size="18">A 可以求 min / median；B 只有一个批量平均值，不能由它推回 min / median。</text>
</g></svg>
