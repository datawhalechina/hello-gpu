<text x="795" y="544" font-size="29" fill="#27323A" text-anchor="middle" font-weight="400">10</text>
<rect x="906" y="507" width="148" height="54" rx="8" fill="#FFFFFF" stroke="#CBD1D3" stroke-width="2"/>
<text x="980" y="544" font-size="29" fill="#27323A" text-anchor="middle" font-weight="400">14</text>
<text x="312" y="614" font-size="23" fill="#59646B" text-anchor="end" font-weight="400">j=3</text>
<rect x="351" y="573" width="148" height="54" rx="8" fill="#FFFFFF" stroke="#CBD1D3" stroke-width="2"/>
<text x="425" y="610" font-size="29" fill="#27323A" text-anchor="middle" font-weight="400">3</text>
<rect x="536" y="573" width="148" height="54" rx="8" fill="#FFFFFF" stroke="#CBD1D3" stroke-width="2"/>
<text x="610" y="610" font-size="29" fill="#27323A" text-anchor="middle" font-weight="400">7</text>
<rect x="721" y="573" width="148" height="54" rx="8" fill="#FFFFFF" stroke="#CBD1D3" stroke-width="2"/>
<text x="795" y="610" font-size="29" fill="#27323A" text-anchor="middle" font-weight="400">11</text>
<rect x="906" y="573" width="148" height="54" rx="8" fill="#FFFFFF" stroke="#CBD1D3" stroke-width="2"/>
<text x="980" y="610" font-size="29" fill="#27323A" text-anchor="middle" font-weight="400">15</text>
<text x="48" y="706" font-size="24" fill="#59646B" text-anchor="start" font-weight="400">概念示意：真实 wavefront 有 32 个 lane；本图不表示显存事务或执行耗时。</text>
</g></svg>
