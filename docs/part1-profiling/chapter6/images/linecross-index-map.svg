<rect x="906" y="375" width="148" height="54" rx="8" fill="#FCF0E3" stroke="#AD651E" stroke-width="2"/>
<text x="980" y="412" font-size="29" fill="#AD651E" text-anchor="middle" font-weight="600">12</text>
<text x="312" y="482" font-size="23" fill="#59646B" text-anchor="end" font-weight="400">j=1</text>
<rect x="351" y="441" width="148" height="54" rx="8" fill="#FFFFFF" stroke="#CBD1D3" stroke-width="2"/>
<text x="425" y="478" font-size="29" fill="#27323A" text-anchor="middle" font-weight="400">1</text>
<rect x="536" y="441" width="148" height="54" rx="8" fill="#FFFFFF" stroke="#CBD1D3" stroke-width="2"/>
<text x="610" y="478" font-size="29" fill="#27323A" text-anchor="middle" font-weight="400">5</text>
<rect x="721" y="441" width="148" height="54" rx="8" fill="#FFFFFF" stroke="#CBD1D3" stroke-width="2"/>
<text x="795" y="478" font-size="29" fill="#27323A" text-anchor="middle" font-weight="400">9</text>
<rect x="906" y="441" width="148" height="54" rx="8" fill="#FFFFFF" stroke="#CBD1D3" stroke-width="2"/>
<text x="980" y="478" font-size="29" fill="#27323A" text-anchor="middle" font-weight="400">13</text>
<text x="312" y="548" font-size="23" fill="#59646B" text-anchor="end" font-weight="400">j=2</text>
<rect x="351" y="507" width="148" height="54" rx="8" fill="#FFFFFF" stroke="#CBD1D3" stroke-width="2"/>
<text x="425" y="544" font-size="29" fill="#27323A" text-anchor="middle" font-weight="400">2</text>
<rect x="536" y="507" width="148" height="54" rx="8" fill="#FFFFFF" stroke="#CBD1D3" stroke-width="2"/>
<text x="610" y="544" font-size="29" fill="#27323A" text-anchor="middle" font-weight="400">6</text>
