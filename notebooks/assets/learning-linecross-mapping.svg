<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 250" role="img">
<title>相邻线程的访问位置：只描述地址，不固定 wave 宽度</title>
<rect width="1240" height="250" fill="#f8faf9"/>
<text x="24" y="35" font-family="sans-serif" font-size="22" fill="#173d4e">相邻线程的访问位置：只描述地址，不固定 wave 宽度</text>
<rect x="24" y="64" width="285" height="126" rx="9" fill="#edf4f5" stroke="#497789"/>
<text x="36" y="95" font-family="sans-serif" font-size="16" fill="#183c4a">连续版</text>
<text x="36" y="127" font-family="sans-serif" font-size="16" fill="#183c4a">thread t</text>
<text x="36" y="159" font-family="sans-serif" font-size="16" fill="#183c4a">base + t</text>
<rect x="329" y="64" width="285" height="126" rx="9" fill="#edf4f5" stroke="#497789"/>
<text x="341" y="95" font-family="sans-serif" font-size="16" fill="#183c4a">跨步：第 j 轮</text>
<text x="341" y="127" font-family="sans-serif" font-size="16" fill="#183c4a">thread t</text>
<text x="341" y="159" font-family="sans-serif" font-size="16" fill="#183c4a">base + t × ITEMS + j</text>
<rect x="634" y="64" width="285" height="126" rx="9" fill="#edf4f5" stroke="#497789"/>
<text x="646" y="95" font-family="sans-serif" font-size="16" fill="#183c4a">一个 block</text>
<text x="646" y="127" font-family="sans-serif" font-size="16" fill="#183c4a">blockDim × ITEMS 个元素</text>
<text x="646" y="159" font-family="sans-serif" font-size="16" fill="#183c4a">不足部分由 i &lt; n 保护</text>
<rect x="939" y="64" width="285" height="126" rx="9" fill="#edf4f5" stroke="#497789"/>
<text x="951" y="95" font-family="sans-serif" font-size="16" fill="#183c4a">启动网格</text>
<text x="951" y="127" font-family="sans-serif" font-size="16" fill="#183c4a">ceil(n / (block × ITEMS))</text>
<text x="951" y="159" font-family="sans-serif" font-size="16" fill="#183c4a">每个启动 block 都有工作</text>
<text x="24" y="226" font-family="sans-serif" font-size="15" fill="#445a62">ITEMS 来自 kernel 配置；相邻线程同轮相隔 ITEMS 个元素，不据此推断硬件事务。</text></svg>