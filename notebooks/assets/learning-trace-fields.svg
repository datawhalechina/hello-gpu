<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 250" role="img">
<title>从原始 trace 到目标 kernel 的本次记录</title>
<rect width="1240" height="250" fill="#f8faf9"/>
<text x="24" y="35" font-family="sans-serif" font-size="22" fill="#173d4e">从原始 trace 到目标 kernel 的本次记录</text>
<rect x="24" y="64" width="285" height="126" rx="9" fill="#edf4f5" stroke="#497789"/>
<text x="36" y="95" font-family="sans-serif" font-size="16" fill="#183c4a">原始 CSV</text>
<text x="36" y="127" font-family="sans-serif" font-size="16" fill="#183c4a">可能含初始化与库算子</text>
<text x="36" y="159" font-family="sans-serif" font-size="16" fill="#183c4a">保留原始记录</text>
<rect x="329" y="64" width="285" height="126" rx="9" fill="#edf4f5" stroke="#497789"/>
<text x="341" y="95" font-family="sans-serif" font-size="16" fill="#183c4a">按 kernel 名筛选</text>
<text x="341" y="127" font-family="sans-serif" font-size="16" fill="#183c4a">使用本次目标名字</text>
<text x="341" y="159" font-family="sans-serif" font-size="16" fill="#183c4a">不预填命中条数</text>
<rect x="634" y="64" width="285" height="126" rx="9" fill="#edf4f5" stroke="#497789"/>
<text x="646" y="95" font-family="sans-serif" font-size="16" fill="#183c4a">核对启动配置</text>
<text x="646" y="127" font-family="sans-serif" font-size="16" fill="#183c4a">grid / workgroup / cap</text>
<text x="646" y="159" font-family="sans-serif" font-size="16" fill="#183c4a">与 benchmark 参数一致</text>
<rect x="939" y="64" width="285" height="126" rx="9" fill="#edf4f5" stroke="#497789"/>
<text x="951" y="95" font-family="sans-serif" font-size="16" fill="#183c4a">读取时间与资源</text>
<text x="951" y="127" font-family="sans-serif" font-size="16" fill="#183c4a">End − Start，保留单位</text>
<text x="951" y="159" font-family="sans-serif" font-size="16" fill="#183c4a">缺失值不填 0</text>
<text x="24" y="226" font-family="sans-serif" font-size="15" fill="#445a62">实际 launch 数由本次 CSV 核对；图中不含旧实验的次数或性能数。</text></svg>