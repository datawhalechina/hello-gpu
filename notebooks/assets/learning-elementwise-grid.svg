<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 250" role="img">
<title>Grid-stride：同一线程继续处理后续元素</title>
<rect width="1240" height="250" fill="#f8faf9"/>
<text x="24" y="35" font-family="sans-serif" font-size="22" fill="#173d4e">Grid-stride：同一线程继续处理后续元素</text>
<rect x="24" y="64" width="285" height="126" rx="9" fill="#edf4f5" stroke="#497789"/>
<text x="36" y="95" font-family="sans-serif" font-size="16" fill="#183c4a">全局线程号 t</text>
<text x="36" y="127" font-family="sans-serif" font-size="16" fill="#183c4a">block × blockDim + thread</text>
<text x="36" y="159" font-family="sans-serif" font-size="16" fill="#183c4a">先处理元素 t</text>
<rect x="329" y="64" width="285" height="126" rx="9" fill="#edf4f5" stroke="#497789"/>
<text x="341" y="95" font-family="sans-serif" font-size="16" fill="#183c4a">网格步长 S</text>
<text x="341" y="127" font-family="sans-serif" font-size="16" fill="#183c4a">gridDim × blockDim</text>
<text x="341" y="159" font-family="sans-serif" font-size="16" fill="#183c4a">所有线程覆盖一个网格</text>
<rect x="634" y="64" width="285" height="126" rx="9" fill="#edf4f5" stroke="#497789"/>
<text x="646" y="95" font-family="sans-serif" font-size="16" fill="#183c4a">同一线程继续</text>
<text x="646" y="127" font-family="sans-serif" font-size="16" fill="#183c4a">t → t + S → t + 2S</text>
<text x="646" y="159" font-family="sans-serif" font-size="16" fill="#183c4a">每轮检查 i &lt; n</text>
<rect x="939" y="64" width="285" height="126" rx="9" fill="#edf4f5" stroke="#497789"/>
<text x="951" y="95" font-family="sans-serif" font-size="16" fill="#183c4a">显式 grid cap</text>
<text x="951" y="127" font-family="sans-serif" font-size="16" fill="#183c4a">限制启动 block 数</text>
<text x="951" y="159" font-family="sans-serif" font-size="16" fill="#183c4a">工作量交给循环完成</text>
<text x="24" y="226" font-family="sans-serif" font-size="15" fill="#445a62">线程数减少与单线程循环增加一起发生；这张图没有预设提速。</text></svg>