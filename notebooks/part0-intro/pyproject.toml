[project]
name = "hello-gpu-notebook-part0-intro"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.13.0+rocm10.0.0",
    "rocm[devel]==10.0.0",
    "hello-gpu-notebooks",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
    "triton>=3.8.0",
    "numpy>=2.5.3",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "rocm-amd"
url = "https://stable.repo.amd.com/rocm/whl-next/"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "rocm-amd" }
rocm = { index = "rocm-amd" }
hello-gpu-notebooks = { path = "../common", editable = true }
