// Run before styles and React so a saved day theme never flashes dark.
(() => {
  let preference = 'dark';
  try { preference = localStorage.getItem('vitepress-theme-appearance') || 'dark'; } catch {}
  const dark = preference === 'dark' || (preference === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) || !['light', 'dark', 'auto'].includes(preference);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.classList.toggle('dark', dark);
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  document.documentElement.style.backgroundColor = dark ? '#101213' : '#ffffff';
  document.querySelector('meta[name="theme-color"]').content = dark ? '#101213' : '#ffffff';
})();
