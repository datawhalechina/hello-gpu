name: Refactor accept on merge

# 合并到 refactor/v2 的 PR = 作者验收通过：把待验收的任务和已到达的作者关口标为「已完成」。
# PR 需要来自本仓库的分支（work/G-xx）；fork 来的 PR 拿不到写权限，需要按 README 手动补记。
# 只检出合并后的 refactor/v2 再运行。
on:
  pull_request:
    types: [closed]
    branches: [refactor/v2]

permissions:
  contents: write

concurrency:
  group: refactor-accept
  cancel-in-progress: false

jobs:
  accept:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor/v2
        uses: actions/checkout@v5
        with:
          ref: refactor/v2
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Mark tasks accepted
        run: node scripts/refactor/tasks.mjs accept --note "PR #${{ github.event.pull_request.number }} 已合并"
      - name: Commit and push
        run: |
          git add refactor/tasks docs/course/outline.json
          if git diff --cached --quiet; then
            echo "没有需要更新的任务状态"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(tasks): PR #${{ github.event.pull_request.number }} 已合并，标记验收通过"
          git push origin HEAD:refactor/v2
