[project]
name = "part3-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.4.4",
    "torch[device-gfx1201]==2.13.0+rocm10.0.0",
    "torchvision[device-gfx1201]==0.28.0+rocm10.0.0",
    "torchaudio==2.11.0.2+rocm10.0.0",
    "rocm[devel,device-gfx1201]==10.0.0",
    # Agent 层依赖：LLM 调用、结构化输出、TUI
    "litellm>=1.50",
    "pydantic>=2.0",
    "prompt_toolkit>=3.0",
    "fastapi>=0.100",
    "orjson>=3.0",     # litellm MCP handler 的 http parsing 依赖（function calling 时的一个 import 链）
    "matplotlib>=3.0",  # Roofline 可视化
]

[tool.pytest.ini_options]
testpaths = ["kernel_optimize/tests", "chapter14"]
python_files = ["test_*.py"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "rocm-amd"
url = "https://stable.repo.amd.com/rocm/whl-next/"

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "rocm-amd" }
torchvision = { index = "rocm-amd" }
torchaudio = { index = "rocm-amd" }
rocm = { index = "rocm-amd" }

[dependency-groups]
dev = [
    "pytest>=8.0",
]
